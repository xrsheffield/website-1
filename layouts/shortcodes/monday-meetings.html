<p class="next-monday-meetings">
  The next meetings are on: <span id="dates"></span>
</p>

<script>

// Date will only work as long as there are 2 or more future dates listed.

  const dates = [
    new Date('2023-06-05'),
    new Date('2023-06-12'),
    new Date('2023-06-19'),
    new Date('2023-06-26'),
    new Date('2023-07-03'),
    new Date('2023-07-10'),
    new Date('2023-07-17'),
    new Date('2023-07-24'),
    new Date('2023-07-31'),
    new Date('2023-08-07'),
    new Date('2023-08-14'),
    new Date('2023-08-21'),
    new Date('2023-08-28'),
    new Date('2023-09-04'),
    new Date('2023-09-11'),
    new Date('2023-09-18'),
    new Date('2023-09-25'),
    new Date('2023-10-02'),
    new Date('2023-10-09'),
    new Date('2023-10-16'),
    new Date('2023-10-23'),
    new Date('2023-10-30'),
    new Date('2023-11-06'),
    new Date('2023-11-13'),
    new Date('2023-11-20'),
    new Date('2023-11-27'),
  ];

  const datesEl = document.querySelector('#dates');

  function pickTwoDates(dates) {
    let today = new Date();
    let firstDate;
    let secondDate;

    // find the first date, either today or the next one after today
    // subtract the number of milliseconds in a day - 86,400,000 - for the first day to make sure today is included.
    for (let i = 0; i < dates.length; i++) {
      if (dates[i].getTime() >= today.getTime() - 86400000) {
        firstDate = dates[i];
        break;
      }
    }

    // find the second date, the next one after the first date found above
    for (let i = 0; i < dates.length; i++) {
      if (dates[i].getTime() > firstDate.getTime()) {
        secondDate = dates[i];
        break;
      }
    }

    datesEl.innerHTML = `
      <b>${firstDate.getDate()} 
        ${firstDate.toLocaleString( 'default', { month: 'long' } )}</b>
         and 
      <b>${secondDate.getDate()} 
      ${secondDate.toLocaleString( 'default', { month: 'long' } )}</b>.
    `;
  }
  pickTwoDates(dates);
</script>
