    {{ with .Params.cover_image }}
    
    {{ $img_url := print . }}
        {{ with resources.Get $img_url }}
        {{ $image := . }}
            {{ if gt $image.Width 1004 }}
                {{ $image = $image.Resize "1004x" }}
            {{ end }}
            <img src="{{ $image.RelPermalink }}" class="cover-image" alt="Cover image" style="max-width: 100%;">
        {{ end }}
    {{ end }}
