    <div class="author-date">
        <div class="section">Posted in: <a href="/{{.Section }}">{{ .Section | title }}</a></div>

        {{ with .Params.author }}
        <div class="author">By: {{ . }}</div>
        {{ end }}
        {{ with .Date }}
            <time>on {{ .Format "Jan 02, 2006" }}</time>
        {{ end }}
        <div class="reading-time">{{ .ReadingTime }} min read</div>
    </div>
