<!DOCTYPE html>
<html lang="en">
    {{- partial "head.html" . }}
<body class="{{ if ne "Section" "" }}{{- .Section }}{{ end }} {{- if .IsHome }}home {{- else }} {{ replace .Title " " "-" | lower }}{{ end }}">
    <div class="wrapper">
        {{- partial "header.html" . -}}
        <main>
        {{- block "main" . }}{{- end }}
        {{ partial "back-to-top" . }}
        {{ partial "sidebar" . }}
        </main>
        {{- partial "footer.html" . -}}
    </div>

    {{ if .IsHome }}
    <script>
    if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
        if (!user) {
            window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
            });
        }
        });
    }
    </script>
    {{ end }}
</body>
</html>
