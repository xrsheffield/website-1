{{ define "main" }}

    <article>
        <div class="time">
        <i>Site updated on:</i> <time>{{ now.Format "Monday Jan 2, 2006" }}</time>
        </div>
        <h1>{{ .Title | safeHTML }}</h1>
        <section class="content">
            {{ .Content }}
        </section>
        {{ partial "join" . }}
        {{ partial "social-share-btns" . }}
    </article>

{{ end }}
